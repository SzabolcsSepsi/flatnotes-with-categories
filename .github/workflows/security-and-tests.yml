name: Security and tests
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.13.6
      - run: uv sync --locked --no-dev
      - run: npm ci --ignore-scripts --no-fund
      - run: npm test
      - run: npm audit --audit-level=low
      - run: npm run build
      - run: .venv/bin/python scripts/check_boundaries.py
      - run: .venv/bin/python tests/security_smoke.py
      - run: npx playwright install --with-deps chromium
      - run: .venv/bin/python tests/run_browser.py
      - name: Secret scan
        run: |
          .venv/bin/python scripts/fetch_gitleaks.py
          .qa/tools/gitleaks dir --config .gitleaks.toml --redact --no-banner .
      - name: Python advisories and applicability checks
        shell: bash
        run: |
          mkdir -p .qa
          uvx --from pip-audit==2.10.1 pip-audit --path .venv/lib/python3.13/site-packages --format json --output .qa/python-audit.json || test "$?" -eq 1
          .venv/bin/python scripts/check_python_audit.py .qa/python-audit.json
      - name: Build pinned container
        run: docker build --pull --tag flatnotes-local:test .
      - name: Exercise built container
        run: .venv/bin/python tests/container_smoke.py
      - name: Scan patchable high and critical OS vulnerabilities
        shell: bash
        run: |
          docker save flatnotes-local:test --output .qa/image.tar
          docker run --rm -v "$PWD/.qa:/scan:ro" aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c image --input /scan/image.tar --pkg-types os --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
  upstream:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check upstream release
        run: python3 scripts/check_upstream.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
